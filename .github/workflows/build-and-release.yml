name: Build IPA and APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # === Step 1: Increment version and generate changelog ===
  prepare:
    name: Prepare Version & Changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      android_code: ${{ steps.version.outputs.android_code }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Increment version numbers
        id: version
        run: |
          chmod +x scripts/increment-version.sh
          bash scripts/increment-version.sh
          VERSION=$(head -1 VERSION.txt)
          BUILD=$(grep '^build=' VERSION.txt | cut -d= -f2)
          ANDROID_CODE=$(grep '^android_code=' VERSION.txt | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "android_code=$ANDROID_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Build: $BUILD, Android Code: $ANDROID_CODE)"

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          CHANGELOG=$(bash scripts/generate-changelog.sh "${{ steps.version.outputs.version }}")
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "Build Bot"
          git config user.email "bot@deepseek-ai.local"
          git add -A
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push

  # === Step 2: Build iOS IPA (TrollStore compatible) ===
  build-ios:
    name: Build iOS IPA (TrollStore)
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup cache for native deps
        uses: actions/cache@v4
        id: native-deps-cache
        with:
          path: |
            # Final outputs (used by Xcode)
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
            # Intermediate build dirs (faster incremental builds)
            deps/lame-build
            deps/ffmpeg-6.1.2/build-ios
            deps/ish/build-ios
            # Downloaded source (skip re-download)
            deps/ffmpeg-6.1.2
          key: ios-native-deps-${{ runner.os }}-${{ hashFiles('deps/*.sh', 'deps/ffmpeg-patch/**', '.gitmodules') }}
          restore-keys: |
            ios-native-deps-${{ runner.os }}-

      - name: Cache status
        run: |
          if [ "${{ steps.native-deps-cache.outputs.cache-hit }}" = "true" ]; then
            echo "✅ Native deps cache HIT - skipping full rebuild"
          else
            echo "⚠️  Native deps cache MISS - will do full build"
          fi

      - name: Install build dependencies
        run: brew install ninja llvm libarchive pkg-config meson lld ldid

      - name: Prepare Xcode config
        run: |
          if [ -f src/ios/Configs/ProviderCustomization.xcconfig.example ] && [ ! -f src/ios/Configs/ProviderCustomization.xcconfig ]; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
            echo "Created ProviderCustomization.xcconfig from example"
          fi

      - name: Build LAME
        run: ./deps/build_lame.sh
        working-directory: ${{ github.workspace }}

      - name: Build FFmpeg
        run: ./deps/build_ffmpeg.sh
        working-directory: ${{ github.workspace }}

      - name: Build iSH
        run: ./deps/build_ish.sh
        working-directory: ${{ github.workspace }}

      - name: Prepare Alpine rootfs
        run: ./deps/prepare_alpine_rootfs.sh
        working-directory: ${{ github.workspace }}

      - name: Build IPA (unsigned, TrollStore compatible)
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          cd src/ios

          # Build with version override (fixes version mismatch between Release tag and app binary)
          xcodebuild -project Minis.xcodeproj -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$APP_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          # Find the .app bundle
          app_path=$(find ./DerivedData -name "*.app" -type d | head -1)
          echo "Found app at: $app_path"
          app_name=$(basename "$app_path" .app)
          binary_path="$app_path/$app_name"

          # Update CFBundleDisplayName in Info.plist to 龙虾Ai
          # (in case it's generated and not from our Info.plist)
          plist_path="$app_path/Info.plist"
          if [ -f "$plist_path" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 龙虾Ai" "$plist_path" 2>/dev/null || true
          fi

          # Function: inject entitlements into a binary
          inject_entitlements() {
            local binary="$1"
            local entitlements_file="$2"
            local label="$3"
            if [ -f "$entitlements_file" ] && [ -f "$binary" ]; then
              echo "Injecting entitlements for $label..."
              ldid -S"$entitlements_file" "$binary"
              echo "  Done. Verifying:"
              ldid -e "$binary" 2>&1 | head -20
              echo "  ---"
            else
              echo "WARNING: Skipping $label - entitlements or binary not found"
              [ -f "$entitlements_file" ] || echo "  Missing: $entitlements_file"
              [ -f "$binary" ] || echo "  Missing: $binary"
            fi
          }

          # Inject main app entitlements
          inject_entitlements "$binary_path" "Minis.entitlements" "Main App ($app_name)"

          # Function: inject entitlements into an app extension
          inject_appex_entitlements() {
            local appex_path="$1"
            local entitlements_file="$2"
            local label="$3"
            if [ ! -d "$appex_path" ]; then
              echo "WARNING: $label appex not found at $appex_path"
              return
            fi
            # Read the binary name from Info.plist
            local binary_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$appex_path/Info.plist" 2>/dev/null)
            if [ -z "$binary_name" ]; then
              echo "WARNING: Could not read CFBundleExecutable for $label"
              return
            fi
            local binary="$appex_path/$binary_name"
            inject_entitlements "$binary" "$entitlements_file" "$label"
          }

          # Inject app extension entitlements
          plugins_dir="$app_path/PlugIns"
          if [ -d "$plugins_dir" ]; then
            echo "Found PlugIns directory, processing app extensions..."

            # Share Extension
            inject_appex_entitlements "$plugins_dir/MinisShare.appex" "ShareExtension/ShareExtension.entitlements" "Share Extension"

            # File Provider Extension
            inject_appex_entitlements "$plugins_dir/MinisFileProvider.appex" "FileProvider/FileProvider.entitlements" "File Provider Extension"

            # Agent Widget Extension
            inject_appex_entitlements "$plugins_dir/AgentWidgetExtension.appex" "AgentWidget/AgentWidget.entitlements" "Agent Widget Extension"
          else
            echo "No PlugIns directory found - skipping extension entitlements injection"
          fi

          echo "All entitlements injection complete."

          # Package as IPA (rename to 龙虾Ai + version)
          mkdir -p Payload
          cp -r "$app_path" Payload/
          IPA_NAME="龙虾Ai-v${APP_VERSION}.ipa"
          zip -r -q "$IPA_NAME" Payload
          echo "IPA created: $(ls -lh "$IPA_NAME")"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 龙虾Ai-ipa
          path: src/ios/龙虾Ai-v${{ needs.prepare.outputs.version }}.ipa
          retention-days: 30

  # === Step 3: Build Android APK ===
  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup cache for native deps
        uses: actions/cache@v4
        id: android-native-deps-cache
        with:
          path: |
            deps/build/proot-android
            src/android/app/src/main/assets/proot-aarch64
          key: android-native-deps-${{ runner.os }}-${{ hashFiles('deps/build_proot.sh', '.gitmodules') }}
          restore-keys: |
            android-native-deps-${{ runner.os }}-

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            android-gradle-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Build PRoot
        run: ./deps/build_proot.sh
        working-directory: ${{ github.workspace }}

      - name: Prepare Android sandbox
        run: |
          chmod +x scripts/prepare_android_sandbox.sh
          bash scripts/prepare_android_sandbox.sh
        working-directory: ${{ github.workspace }}

      - name: Build APK
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          APP_ANDROID_CODE: ${{ needs.prepare.outputs.android_code }}
        run: |
          cd src/android

          # Override version in build.gradle.kts (fixes version mismatch)
          sed -i "s/versionCode = .*/versionCode = $APP_ANDROID_CODE/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"$APP_VERSION\"/" app/build.gradle.kts
          echo "Android version set to $APP_VERSION (code: $APP_ANDROID_CODE)"

          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

          # Rename APK to include app name and version
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_DST="app/build/outputs/apk/debug/龙虾Ai-v${APP_VERSION}.apk"
          if [ -f "$APK_SRC" ]; then
            mv "$APK_SRC" "$APK_DST"
            echo "APK renamed to: $(ls -lh "$APK_DST")"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 龙虾Ai-apk
          path: src/android/app/build/outputs/apk/debug/龙虾Ai-v${{ needs.prepare.outputs.version }}.apk
          retention-days: 30

  # === Step 4: Create GitHub Release ===
  release:
    name: Create Release
    needs: [prepare, build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: 龙虾Ai-ipa
          path: artifacts

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: 龙虾Ai-apk
          path: artifacts

      - name: Display artifacts
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: "龙虾Ai v${{ needs.prepare.outputs.version }}"
          body: ${{ needs.prepare.outputs.changelog }}
          files: |
            artifacts/龙虾Ai-v${{ needs.prepare.outputs.version }}.ipa
            artifacts/龙虾Ai-v${{ needs.prepare.outputs.version }}.apk
          draft: false
          prerelease: false
